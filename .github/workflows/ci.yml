name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
  push:
    branches:
      - main
    # a version, bare as the other Watcher applications tag it: 1.0.0, 1.1.0-RC1
    tags:
      - '[0-9]*'

permissions:
  contents: read
  packages: write

env:
  # The branch built into the image of its name. A nightly run builds this branch, and the newest
  # release, which `latest` and the version tags point at.
  CURRENT_BRANCH: 'main'
  BASE_IMAGE: dunglas/frankenphp:php8.4-alpine

jobs:
  ##########################################################################
  # Tests and static analysis, on the PHP the image runs
  ##########################################################################
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  ##########################################################################
  # The image: from the branch and from git tags, after the tests, and
  # nightly also from the newest release, so that it gets the fixes of a new
  # base image too. Resolve what to build, once, and share it with the build
  # jobs as a list of targets.
  ##########################################################################
  setup:
    name: Resolve targets and base image
    needs: test
    # It runs when the tests failed too: a release rebuilt for a new base image was tested when
    # it was made, and the step below decides what failed tests hold back.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.targets.outputs.image }}
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && env.CURRENT_BRANCH || '' }}
          # the tags, to find the newest release
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each target is one commit with every image tag it is owed. Its key is the commit and the
      # digest of the base image, so a new base image (PHP, Caddy or Alpine fixes) is a reason to
      # rebuild too, and a nightly run passes over a target whose key is already in the registry.
      - name: Targets
        id: targets
        env:
          TESTS_PASSED: ${{ needs.test.result == 'success' }}
        run: |
          set -euo pipefail

          # docker/metadata-action lowercases the image name on its own, but the digest push and
          # the manifest merge address the registry directly
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          base_digest="$(docker buildx imagetools inspect --raw "$BASE_IMAGE" | sha256sum | cut -c1-12)"
          echo "::notice::Base image $BASE_IMAGE digest $base_digest"

          # the releases matching a pattern, oldest first, without release candidates
          releases() {
            git tag --list "$1" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true
          }

          targets='[]'

          # want <commit-ish> <release or empty> <branch tag: true or false>
          want() {
            local sha version key release="$2" branch="$3" minor=false major=false latest=false
            sha="$(git rev-parse "$1^{commit}")"
            version="${sha:0:7}"
            key="build-$version-$base_digest"

            # 1.0, 1 and latest go only to the newest release of each, so that rebuilding an older
            # one does not take them back
            if [ -n "$release" ]; then
              if [ "$(releases "${release%.*}.*" | tail -n 1)" = "$release" ]; then minor=true; fi
              if [ "$(releases "${release%%.*}.*" | tail -n 1)" = "$release" ]; then major=true; fi
              if [ "$(releases '*' | tail -n 1)" = "$release" ]; then latest=true; fi
            fi

            if [ "$GITHUB_EVENT_NAME" = schedule ] && docker manifest inspect "$image:$key" > /dev/null 2>&1; then
              echo "::notice::$image:$key exists, $1 is not built again"
              return 0
            fi
            echo "::notice::Building $1 ($version) as $key"

            # a commit wanted twice, as the branch and as a release, is built once with both
            targets="$(jq -c \
              --arg ref "$sha" --arg version "$version" --arg key "$key" --arg release "$release" \
              --argjson minor "$minor" --argjson major "$major" --argjson latest "$latest" \
              --argjson branch "$branch" '
              if any(.[]; .ref == $ref) then
                map(if .ref == $ref then
                  (.branch = (.branch or $branch))
                  | if $release != "" then
                      .release = $release | .minor = $minor | .major = $major | .latest = $latest
                    else . end
                else . end)
              else
                . + [{ref: $ref, version: $version, key: $key, release: $release,
                      minor: $minor, major: $major, latest: $latest, branch: $branch}]
              end' <<< "$targets")"
          }

          case "$GITHUB_EVENT_NAME" in
            schedule)
              # the branch once its tests pass, and the newest release whatever they say, as it
              # was tested when it was made
              if [ "$TESTS_PASSED" = true ]; then want HEAD '' true; fi
              newest="$(releases '*' | tail -n 1)"
              if [ -n "$newest" ]; then want "$newest" "$newest" false; fi
              ;;
            push | workflow_dispatch)
              if [ "$TESTS_PASSED" = true ] && [ "$GITHUB_REF_TYPE" = tag ]; then
                want HEAD "$GITHUB_REF_NAME" false
              elif [ "$TESTS_PASSED" = true ] && [ "$GITHUB_REF_NAME" = "$CURRENT_BRANCH" ]; then
                want HEAD '' true
              fi
              ;;
            *)
              # a pull request, built into the cache only
              if [ "$TESTS_PASSED" = true ]; then want HEAD '' false; fi
              ;;
          esac

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "::notice::Targets: $(jq -r '
            if length == 0 then "nothing to build"
            else map(.version + (if .release != "" then " " + .release else "" end)
                     + (if .branch then " " + env.CURRENT_BRANCH else "" end)
                     + (if .latest then " latest" else "" end)) | join(", ")
            end' <<< "$targets")"

  ##########################################################################
  # One job per target and architecture, each on a native runner (no QEMU
  # emulation). Nothing is tagged here - each job pushes an untagged image
  # and reports back only its digest. A release is built with the workflow
  # of today and the Dockerfile it was tagged with.
  ##########################################################################
  build:
    name: Build ${{ matrix.target.release || matrix.target.version }} ${{ matrix.platform }}
    needs: setup
    if: needs.setup.outputs.targets != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.targets) }}
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Announce build
        run: |
          echo "::notice::Building ${{ matrix.platform }} image for ${{ matrix.target.version }} ${{ matrix.target.release }}"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.target.ref }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.setup.outputs.image }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests cannot push, so they build into the cache only and
      # produce no digest for the merge job.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: docker/Dockerfile.production
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: ${{ needs.setup.outputs.image }}
          outputs: ${{ github.event_name != 'pull_request' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
          build-args: |
            buildno=${{ github.run_number }}
            gitcommithash=${{ matrix.target.ref }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.target.key }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  ##########################################################################
  # Join the per-architecture digests of each target into one multi-arch
  # manifest and attach the real tags to it: a release gets its version
  # (1.2.3, and 1.2, 1 and latest while it is the newest of them; a release
  # candidate only its own), the branch gets its name.
  ##########################################################################
  merge:
    name: Push ${{ matrix.target.release || matrix.target.version }} manifest
    needs:
      - setup
      - build
    if: needs.setup.outputs.targets != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.targets) }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target.key }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.setup.outputs.image }}
          # The version comes from the target, not from the ref the run was started from: a
          # nightly run of the branch rebuilds a release as well.
          tags: |
            type=semver,pattern={{version}},value=${{ matrix.target.release }},enable=${{ matrix.target.release != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ matrix.target.release }},enable=${{ matrix.target.minor }}
            type=semver,pattern={{major}},value=${{ matrix.target.release }},enable=${{ matrix.target.major }}
            type=raw,value=latest,enable=${{ matrix.target.latest }}
            type=raw,value=${{ env.CURRENT_BRANCH }},enable=${{ matrix.target.branch }}
            type=raw,value=sha-${{ matrix.target.version }}
            type=raw,value=${{ matrix.target.key }}
          flavor: |
            latest=false

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.setup.outputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ needs.setup.outputs.image }}:${{ matrix.target.key }}"
